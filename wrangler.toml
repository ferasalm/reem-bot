# Cloudflare Worker config for reem-bot (deployed by .github/workflows/deploy.yml)
name = "reem-bot"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Keep variables set in the dashboard; secrets are never touched by deploys
keep_vars = true

[[kv_namespaces]]
binding = "REEM_KV"
id = "0986ed4bf1964b0c9791c8a93179e639" # namespace "reem"

[[queues.producers]]
binding = "REEM_QUEUE"
queue = "reem-inbox"

[[queues.consumers]]
queue = "reem-inbox"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0
max_concurrency = 1

# She may text first: checked every 15 minutes (CONFIG.PROACTIVE in worker.js)
[triggers]
crons = ["*/15 * * * *"]

# Workers AI (Workers Paid: 10,000 neurons a day free, then $0.011 per 1,000; capped in CONFIG.AI_BUDGET): she sees his photos and draws pictures (CONFIG.VISION, CONFIG.PICTURE)
[ai]
binding = "AI"

# Long memory (CONFIG.RECALL): older messages as vectors, searched before she replies. tools/cf-resources.sh creates
# the index (1024 dimensions, cosine, metadata indexes "chat" and "who"); deploy.yml runs it first.
[[vectorize]]
binding = "MEMORY_INDEX"
index_name = "reem-memory"
