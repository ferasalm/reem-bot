name: Picture writer replay

# Step C (2026-10-13): the picture writer (PICTURE.WRITER, LOOK.PROMPT) on real Workers AI text models, no pictures
# (tools/test/writer-replay.mjs prints every answer and its seconds). One job per variant (model, token cap). Runs when the script
# or this file changes (never on dev/main), or by hand.
on:
  push:
    branches-ignore: [dev, main, face-candidates]
    paths: [tools/test/writer-replay.mjs, .github/workflows/writer-replay.yml]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the bot's own settings (Llama 3.3 70B fast since 2026-10-13); add rows to compare another model or token cap, e.g.
          # { name: deepseek, model: "@cf/deepseek-ai/deepseek-v4-flash-0731", tokens: "1000" } (run 38337486774: median 14.5 s)
          - { name: bot-settings, model: "", tokens: "" }
    name: replay ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test/writer-replay.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUNS: "1"
          WRITER_MODEL: ${{ matrix.model }}
          WRITER_MAX_TOKENS: ${{ matrix.tokens }}
