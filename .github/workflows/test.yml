name: Tests

# Mocked tests run on every push (free). The live check against the real model (a few cents on
# OpenRouter) only runs when a commit message contains [live], or by hand from the Actions tab
# (the "Run workflow" button appears once this file is on main). It needs the repository secret
# OPENROUTER_API_KEY. Neither job deploys anything.
on:
  push:
  workflow_dispatch:
    inputs:
      runs:
        description: "Tries per situation"
        default: "3"
      only:
        description: "Only these situations (comma-separated ids, empty = all)"
        default: ""
      model:
        description: "Ask this model instead of LLM.MODEL (OpenRouter id, or @cf/... on Workers AI with no OpenRouter call)"
        default: ""
      cf_reasoning:
        description: "For a @cf/ model: reasoning_effort to send instead of none (low, high)"
        default: ""

jobs:
  # Fails when this branch misses work from the shared branch (dev, or main until dev exists);
  # warns when other branches hold work that isn't here. See tools/sync-check.mjs.
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-check.mjs --ci

  mocked:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check worker.js
      - name: Settings panel matches worker.js CONFIG
        run: node tools/build-panel.mjs && git diff --exit-code tools/settings-panel.html
      - run: node tools/test/unit.mjs
      - run: node tools/test/scenarios.mjs
      - run: node tools/test/e2e.mjs > /dev/null   # exits 1 on any false check
      - name: Docs rules (HANDOFF/LESSONS size, dated decisions, effort per next step, every file in docs/MAP.md)
        run: node tools/doc-check.mjs
      - name: The Worker builds (wrangler bundles face.js; the AI binding parses). Nothing is deployed.
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir dist

  live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask the real model (see the log for every reply)
        run: node tools/test/live.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_RUNS: ${{ github.event.inputs.runs || '3' }}
          LIVE_ONLY: ${{ github.event.inputs.only || '' }}
          LIVE_MODEL: ${{ github.event.inputs.model || '' }}
          LIVE_CF_REASONING: ${{ github.event.inputs.cf_reasoning || '' }}
