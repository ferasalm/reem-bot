name: Model bench

# Runs tools/model-bench/bench.mjs against OpenRouter with a hard spending cap.
# Results are uploaded as an artifact and printed to the log (the repo is private).
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Hard spending cap in USD"
        default: "0.08"
      plan:
        description: "lean or full"
        default: "lean"
      args:
        description: "Extra bench arguments, e.g. --only @novita --reps 2,3,2"
        default: ""
  push:
    branches: [claude/reem-llm-model-comparison-f27xor, ccr-b7869b5d-d7yudi]
    paths: [.github/workflows/model-bench.yml]

# Arguments for runs started by a push of this file (workflow_dispatch uses its inputs instead).
# Last push run: DeepSeek switch, re-check of the tightened scene/voice/intimacy nudges.
env:
  PUSH_BUDGET: "0.03"
  PUSH_PLAN: full
  PUSH_ARGS: --only bot --reps 2,3,3

concurrency:
  group: model-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: '[ -n "$OPENROUTER_API_KEY" ] || { echo "::error::OPENROUTER_API_KEY secret is not set"; exit 1; }'
      - name: Run bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node tools/model-bench/bench.mjs --budget "${{ inputs.budget || env.PUSH_BUDGET }}" --plan "${{ inputs.plan || env.PUSH_PLAN }}" ${{ github.event_name == 'push' && env.PUSH_ARGS || inputs.args }} --out bench-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-bench-results
          path: bench-results/
          retention-days: 7
      - name: Print results
        if: always()
        run: |
          for f in summary.md replies.md; do
            echo "===== $f ====="
            cat "bench-results/$f" 2>/dev/null || echo "(missing)"
          done
