name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.145.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the GitHub secret RUNWARE_API_KEY becomes the Worker's (PICTURE.ROUTE "runware-…"; skipped while it's empty)
          secrets: |
            RUNWARE_API_KEY
        env:
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
      # A read-only check of Workers AI on the live Worker: draws one small picture from her face and describes
      # it (see /health in worker.js). Printed for the log; never fails the deploy.
      - name: Check Workers AI (/health)
        run: |
          sleep 20
          curl -sS --max-time 120 https://reem-bot.ferris-wheel736.workers.dev/health || echo "health check unreachable"
