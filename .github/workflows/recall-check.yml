name: Recall check

# How close the vector model (RECALL.MODEL on Workers AI) puts pairs of her replies (tools/test/recall-check.mjs),
# to set RECALL.REPEAT_SCORE. Cloudflare only (no OpenRouter).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test/recall-check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
