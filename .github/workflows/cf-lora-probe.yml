name: Cloudflare LoRA probe

# Owner 2026-10-13: does Workers AI's FLUX.2 klein take a LoRA? (Step B: 9B + Lenovo, refused; Step C: 4B + anatomy fixer and amateur selfies) tools/face/cf-lora-probe.sh prints
# Cloudflare's answers; the pictures go to face-candidates (runs/<run id>-cf-lora-probe). Runs when the script changes.
on:
  push:
    branches-ignore: [dev, main, face-candidates]
    paths: [tools/face/cf-lora-probe.sh]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/tools/face/cf-lora-probe.sh"
      - name: Push the pictures to face-candidates
        run: |
          git config user.name "face-bot"
          git config user.email "face-bot@users.noreply.github.com"
          dir="runs/${{ github.run_id }}-cf-lora-probe"
          git fetch origin face-candidates
          git checkout -B face-candidates origin/face-candidates
          mkdir -p "$dir" && cp "$RUNNER_TEMP"/out/*.jpg "$dir/" 2>/dev/null || true
          git add runs && git commit -m "Cloudflare LoRA probe: run ${{ github.run_id }}" && git push origin face-candidates || echo "nothing to push"
