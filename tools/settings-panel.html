<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reem Settings Panel</title>
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1c1a;--muted:#6b6862;--line:#e4e1db;
  --accent:#b4235a;--accent-soft:#fbe7ef;--changed:#fff3cd;--changed-line:#e0b100;
  --ok:#1f7a45;--input:#fbfaf8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151413;--card:#201f1d;--ink:#eeebe6;--muted:#a19c94;--line:#34322e;
  --accent:#f0679c;--accent-soft:#3a1e2a;--changed:#3a3115;--changed-line:#c99b12;
  --ok:#5fcf8c;--input:#191817;
}}
:root[data-theme="dark"]{
  --bg:#151413;--card:#201f1d;--ink:#eeebe6;--muted:#a19c94;--line:#34322e;
  --accent:#f0679c;--accent-soft:#3a1e2a;--changed:#3a3115;--changed-line:#c99b12;
  --ok:#5fcf8c;--input:#191817;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
header h1{font-size:24px;margin:0}
header p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
#summary{border:2px solid var(--accent)}
#summary h2{margin:0 0 8px;font-size:18px;color:var(--accent)}
#summary .stamp{color:var(--muted);font-size:13px}
#changes{margin:10px 0 0;padding:0;list-style:none}
#changes li{padding:8px 10px;border-radius:8px;background:var(--accent-soft);margin:6px 0;word-break:break-word}
#changes .path{font-weight:600}
#changes .from{color:var(--muted);text-decoration:line-through}
#changes .to{font-weight:600}
.empty{color:var(--muted);font-style:italic}
#note{width:100%;min-height:60px;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(.97)}
.toast{color:var(--ok);font-size:13px;align-self:center}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav a{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:4px 10px;border-radius:999px}
section.card h2{margin:0 0 2px;font-size:17px}
section.card > p{margin:0 0 10px;color:var(--muted);font-size:13px}
.field{display:grid;grid-template-columns:minmax(150px,230px) 1fr auto;gap:6px 12px;align-items:start;padding:9px 8px;border-radius:9px;border-left:4px solid transparent}
.field + .field{border-top:1px solid var(--line)}
.field.changed{background:var(--changed);border-left-color:var(--changed-line)}
.field label{font-weight:600}
.field .key{display:block;font:11px ui-monospace,Menlo,monospace;color:var(--muted);font-weight:400;word-break:break-all}
.field .hint{grid-column:2/3;color:var(--muted);font-size:12.5px;margin-top:-2px}
.field .reset{visibility:hidden;font-size:12px;padding:3px 8px}
.field.changed .reset{visibility:visible}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{resize:vertical;min-height:70px}
textarea.long{min-height:220px;font-size:13.5px}
.num{display:flex;gap:10px;align-items:center}
.num input[type=range]{flex:1;accent-color:var(--accent)}
.num input[type=number]{width:110px;flex:none}
.switch{display:flex;align-items:center;gap:8px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
table.cmds{width:100%;border-collapse:collapse}
table.cmds td,table.cmds th{padding:4px;text-align:left;font-size:13px;vertical-align:top}
table.cmds th{color:var(--muted);font-weight:600}
.fixed{font:12px ui-monospace,Menlo,monospace;color:var(--muted);padding-top:10px}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
.toolbar{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:640px){
  .field{grid-template-columns:1fr auto}
  .field > :nth-child(2){grid-column:1/3;grid-row:2}
  .field .hint{grid-column:1/3}
  .num input[type=number]{width:90px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="toolbar"><button id="theme" type="button">Light / dark</button></div>
    <h1>Reem settings</h1>
    <p>Change anything below. Changed fields turn yellow and appear in the summary. Screenshot the summary and send it to Claude, or copy it as text.</p>
  </header>

  <div class="card" id="summary">
    <h2>Changes to make</h2>
    <div class="stamp" id="stamp"></div>
    <ul id="changes"></ul>
    <textarea id="note" placeholder="Anything else you want changed? Write it here; it shows up in the summary."></textarea>
    <div class="btns">
      <button class="primary" id="copyText" type="button">Copy changes for Claude</button>
      <button id="copyJson" type="button">Copy as CONFIG_OVERRIDES JSON</button>
      <button id="resetAll" type="button">Reset everything</button>
      <span class="toast" id="toast"></span>
    </div>
  </div>

  <nav id="nav"></nav>
  <div id="sections"></div>
</div>

const STORE_KEY = "reem-settings-panel-v1";
const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const clone = (v) => JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let values = {};   // path -> current value (only for fields shown)
let note = "";
const labels = {};

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved) { values = saved.values || {}; note = saved.note || ""; }
  } catch {}
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ values, note })); } catch {}
}
const current = (path) => (path in values ? values[path] : clone(get(DEFAULTS, path)));

function seconds(ms) {
  if (ms == null || isNaN(ms)) return "";
  return ms >= 60000 ? `= ${+(ms / 60000).toFixed(2)} min` : `= ${+(ms / 1000).toFixed(2)} s`;
}

function render() {
  $("#nav").innerHTML = SECTIONS.map((s) => `<a href="#sec-${s.id}">${esc(s.title)}</a>`).join("");
  $("#sections").innerHTML = SECTIONS.map((s) => `
    <section class="card" id="sec-${s.id}">
      <h2>${esc(s.title)}</h2>${s.desc ? `<p>${esc(s.desc)}</p>` : ""}
      ${s.fields.map(fieldHtml).join("")}
    </section>`).join("");
  for (const s of SECTIONS) for (const f of s.fields) wire(f);
  $("#note").value = note;
  refresh();
}

function fieldHtml([path, label, type, hint = "", opt = {}]) {
  labels[path] = label;
  const id = "f-" + path.replace(/\./g, "-");
  const v = current(path);
  let input = "";
  if (type === "text") input = `<input type="text" id="${id}" value="${esc(v)}">`;
  else if (type === "textarea") input = `<textarea id="${id}">
${esc(v)}</textarea>`;
  else if (type === "long") input = `<details><summary>Show / edit</summary><textarea class="long" id="${id}">
${esc(v)}</textarea></details>`;
  else if (type === "map") input = `<textarea id="${id}" rows="${Math.min(Math.max(Object.keys(v).length, 3), 10)}">
${esc(Object.entries(v).map(([k, x]) => `${k} = ${x}`).join("\n"))}</textarea>`;
  else if (type === "groups") input = `<textarea id="${id}" rows="${Math.min(v.length * 3, 12)}">
${esc(v.map((g) => g.join("\n")).join("\n\n"))}</textarea>`;
  else if (type === "schedule") input = `<textarea id="${id}" rows="${Math.max(v.length, 3)}">
${esc(v.map((s) => `${s.from}-${s.to} | ${s.delay} | ${s.doing}`).join("\n"))}</textarea>`;
  else if (type === "list") input = `<textarea id="${id}" rows="${Math.min(Math.max(v.length, 2), 9)}">
${esc(v.join("\n"))}</textarea>`;
  else if (type === "number") input = `<input type="number" id="${id}" value="${v}" ${opt.min != null ? `min="${opt.min}"` : ""} ${opt.max != null ? `max="${opt.max}"` : ""} step="${opt.step || "any"}">`;
  else if (type === "ms") input = `<div class="num"><input type="number" id="${id}" value="${v}" min="0" step="100"><span class="sec" id="${id}-sec">${seconds(v)}</span></div>`;
  else if (type === "range") input = `<div class="num"><input type="range" id="${id}-r" min="${opt.min}" max="${opt.max}" step="${opt.step}" value="${v}"><input type="number" id="${id}" min="${opt.min}" max="${opt.max}" step="${opt.step}" value="${v}"></div>`;
  else if (type === "bool") input = `<label class="switch"><input type="checkbox" id="${id}" ${v ? "checked" : ""}><span id="${id}-txt">${v ? "On" : "Off"}</span></label>`;
  else if (type === "select") input = `<select id="${id}">${opt.options.map(([val, txt]) => `<option value="${esc(val)}" ${val === v ? "selected" : ""}>${esc(txt)}</option>`).join("")}</select>`;
  else if (type === "commands") input = commandsHtml(id, v);
  const unit = type === "ms" ? " (ms)" : "";
  return `<div class="field" id="${id}-row">
    <label for="${id}">${esc(label)}${unit}<span class="key">${esc(path)}</span></label>
    <div>${input}</div>
    <button class="reset" type="button" data-reset="${esc(path)}">Undo</button>
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ""}
  </div>`;
}

function commandsHtml(id, cmds) {
  return `<table class="cmds" id="${id}"><tr><th>Does</th><th>Command</th><th>Aliases (comma-separated)</th><th>Menu description</th></tr>
    ${cmds.map((c, i) => `<tr>
      <td class="fixed">${esc(c.action)}</td>
      <td><input type="text" data-i="${i}" data-k="command" value="${esc(c.command)}"></td>
      <td><input type="text" data-i="${i}" data-k="aliases" value="${esc((c.aliases || []).join(", "))}"></td>
      <td><input type="text" data-i="${i}" data-k="description" value="${esc(c.description)}"></td>
    </tr>`).join("")}</table>`;
}

function readField(path, type, id) {
  const el = document.getElementById(id);
  if (type === "number" || type === "ms" || type === "range") return el.value === "" ? get(DEFAULTS, path) : Number(el.value);
  if (type === "bool") return el.checked;
  if (type === "list") return el.value.split("\n").map((s) => s.trim()).filter(Boolean);
  if (type === "map") {
    const out = {};
    for (const line of el.value.split("\n")) {
      const i = line.indexOf("=");
      if (i > 0) out[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
    }
    return out;
  }
  if (type === "groups") return el.value.split(/\n\s*\n/).map((g) => g.split("\n").map((s) => s.trim()).filter(Boolean)).filter((g) => g.length);
  if (type === "schedule") {
    return el.value.split("\n").map((line) => {
      const m = /^\s*(\d+)\s*-\s*(\d+)\s*\|\s*([\d.]+)\s*\|\s*(.+?)\s*$/.exec(line);
      return m && { from: +m[1], to: +m[2], doing: m[4], delay: +m[3] };
    }).filter(Boolean);
  }
  if (type === "commands") {
    const cmds = clone(current(path));
    el.querySelectorAll("input").forEach((inp) => {
      const c = cmds[+inp.dataset.i];
      if (inp.dataset.k === "aliases") c.aliases = inp.value.split(",").map((s) => s.trim().toLowerCase().replace(/^\//, "")).filter(Boolean);
      else if (inp.dataset.k === "command") c.command = inp.value.trim().toLowerCase().replace(/^\//, "");
      else c.description = inp.value;
    });
    return cmds;
  }
  return el.value;
}

function wire([path, , type]) {
  const id = "f-" + path.replace(/\./g, "-");
  const el = document.getElementById(id);
  const update = () => {
    const v = readField(path, type, id);
    if (same(v, get(DEFAULTS, path))) delete values[path]; else values[path] = v;
    if (type === "range") document.getElementById(id + "-r").value = v;
    if (type === "ms") document.getElementById(id + "-sec").textContent = seconds(v);
    if (type === "bool") document.getElementById(id + "-txt").textContent = v ? "On" : "Off";
    save(); refresh();
  };
  el.addEventListener("input", update);
  el.addEventListener("change", update);
  if (type === "range") {
    document.getElementById(id + "-r").addEventListener("input", (e) => { el.value = e.target.value; update(); });
  }
}

function short(v, path) {
  if (path === "CHARACTER.SCHEDULE") return v.map((s) => `${s.from}-${s.to}: ${s.doing} (×${s.delay})`).join(" · ");
  if (Array.isArray(v) && Array.isArray(v[0])) return v.map((g) => g.join(" / ")).join(" · ");
  if (v && typeof v === "object" && !Array.isArray(v)) {
    const entries = Object.entries(v).map(([k, x]) => `${k}=${x}`);
    return entries.length > 8 ? `${entries.length} entries: ${entries.slice(0, 8).join(", ")}…` : entries.join(", ") || "(empty)";
  }
  if (typeof v === "string") {
    const one = v.replace(/\s+/g, " ");
    if (one.length > 140) return `"${one.slice(0, 120)}…" (${v.length} characters; use Copy for the full text)`;
    return `"${one}"`;
  }
  if (path === "COMMANDS") return v.map((c) => `/${c.command}${c.aliases?.length ? ` (+${c.aliases.map((a) => "/" + a).join(", ")})` : ""}: ${c.description}`).join(" · ");
  if (Array.isArray(v)) return v.length > 4 ? `${v.length} items: ` + v.map((x) => `"${x}"`).join(", ") : "[" + v.map((x) => `"${x}"`).join(", ") + "]";
  if (typeof v === "boolean") return v ? "On" : "Off";
  return String(v);
}

function changeList() {
  const out = [];
  for (const s of SECTIONS) for (const [path] of s.fields) if (path in values) out.push(path);
  return out;
}

function refresh() {
  for (const s of SECTIONS) for (const [path] of s.fields) {
    document.getElementById("f-" + path.replace(/\./g, "-") + "-row").classList.toggle("changed", path in values);
  }
  const list = changeList();
  $("#changes").innerHTML = list.length
    ? list.map((p) => `<li><span class="path">${esc(labels[p])}</span> <span class="key">(${esc(p)})</span><br>
        <span class="from">${esc(short(get(DEFAULTS, p), p))}</span> → <span class="to">${esc(short(values[p], p))}</span></li>`).join("")
    : `<li class="empty" style="background:none;padding:0">No changes yet.</li>`;
  if (note.trim()) $("#changes").innerHTML += `<li><span class="path">Note:</span> ${esc(note.trim())}</li>`;
  const n = list.length;
  $("#stamp").textContent = `${n} setting${n === 1 ? "" : "s"} changed · ${new Date().toLocaleString()}`;
}

function overrides() {
  const out = {};
  for (const p of changeList()) {
    const keys = p.split(".");
    let o = out;
    for (const k of keys.slice(0, -1)) o = o[k] = o[k] || {};
    o[keys.at(-1)] = values[p];
  }
  return out;
}

async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch {} t.remove();
  }
  $("#toast").textContent = msg;
  setTimeout(() => ($("#toast").textContent = ""), 2500);
}

$("#copyText").onclick = () => {
  const list = changeList();
  let text = "Please change these Reem bot settings in worker.js:\n";
  text += list.length ? list.map((p) => `- ${p} (${labels[p]}): ${JSON.stringify(get(DEFAULTS, p))} -> ${JSON.stringify(values[p])}`).join("\n") : "- (no setting changes)";
  if (note.trim()) text += `\n\nAlso: ${note.trim()}`;
  copy(text, "Copied. Paste it into your message to Claude.");
};
$("#copyJson").onclick = () => copy(JSON.stringify(overrides(), null, 2), "Copied. Paste it as CONFIG_OVERRIDES in Cloudflare, then open /setup.");
$("#resetAll").onclick = () => {
  if (!confirm("Undo every change on this page?")) return;
  values = {}; note = ""; save(); render();
};
$("#sections").addEventListener("click", (e) => {
  const p = e.target.dataset && e.target.dataset.reset;
  if (!p) return;
  delete values[p]; save(); render();
});
$("#note").addEventListener("input", (e) => { note = e.target.value; save(); refresh(); });
$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};

load();
render();
</script>
